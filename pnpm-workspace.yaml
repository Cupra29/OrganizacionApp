packages:
  - 'packages/*'
  - 'apps/*'

# Se rellena con lo que reclame `pnpm install`. Vacío es intencional:
# ninguna dependencia ejecuta scripts de instalación todavía.
allowBuilds: []

# Única fuente de verdad de versiones. Los paquetes declaran `catalog:`
# y no una versión literal, así que no puede haber deriva entre ellos.
catalog:
  '@biomejs/biome': 2.5.6
  # Proveedor de cobertura. Entra en la fase 1 porque el umbral de ramas >= 95 % de
  # `packages/temporal` es criterio de aceptación y se declara en el vitest.config.ts RAÍZ
  # (en Vitest 4 la cobertura es configuración de raíz, no de proyecto). Va atado a la misma
  # versión que `vitest`: el proveedor y el runner se publican en lote.
  '@vitest/coverage-v8': ^4.1.10
  dependency-cruiser: ^18.1.0
  # Oráculo diferencial de la expansión de recurrencia, NO implementación: se queda en
  # devDependency. Su `temporal-impl` resuelve `globalThis.Temporal ?? polyfill` sobre un
  # import estático, así que en producción habría dos `Temporal` que no interoperan. ADR-018.
  rrule-temporal: ^2.0.2
  # El único módulo que lo importa es packages/temporal/src/temporal.ts. No es el polyfill de
  # los champions (`@js-temporal`), que sigue en 0.5.1 anterior al Stage 4; el módulo único es
  # lo que hace que cambiar de opinión cueste una línea. ADR-018.
  temporal-polyfill: ^1.0.2
  typescript: ^6.0.3
  vite: ^8.1.5
  vitest: ^4.1.10

minimumReleaseAgeExclude:
  - '@biomejs/biome@2.5.6'
  - '@biomejs/cli-darwin-arm64@2.5.6'
  - '@biomejs/cli-darwin-x64@2.5.6'
  - '@biomejs/cli-linux-arm64-musl@2.5.6'
  - '@biomejs/cli-linux-arm64@2.5.6'
  - '@biomejs/cli-linux-x64-musl@2.5.6'
  - '@biomejs/cli-linux-x64@2.5.6'
  - '@biomejs/cli-win32-arm64@2.5.6'
  - '@biomejs/cli-win32-x64@2.5.6'
