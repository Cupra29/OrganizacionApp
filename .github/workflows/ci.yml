name: CI

# Todas las ramas: la prueba negativa de la frontera (fase-0-ejecucion.md §6)
# no debe necesitar un PR para producir un run rojo.
on:
  push:
  workflow_dispatch:

# Repo público: nada de escritura por defecto.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    # Las acciones de terceros van ancladas por SHA de commit, no por tag: un tag
    # puede re-apuntarse sin dejar diff en este repositorio, y ese código se
    # ejecutaría en el runner en cada push. Hoy el radio es bajo (token de solo
    # lectura, sin secretos), pero se cierra ahora que es barato: el día que entren
    # secretos de despliegue o el disparador `pull_request`, el mismo vector pasa a
    # ser de impacto alto.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Ningún paso de este job hace push; sin esto el GITHUB_TOKEN queda
          # persistido en .git/config del runner el resto del job.
          persist-credentials: false

      # Antes de setup-node: si no, la caché de pnpm no encuentra el gestor.
      # Sin `version:` a propósito — lo lee del campo `packageManager` del
      # package.json, y darle ambos aborta con "multiple versions specified".
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Los cuatro pasos van separados en vez de un único `pnpm verify`: un CI
      # rojo debe decir TODO lo que está mal de una vez. En local `pnpm verify`
      # sigue siendo la puerta única, y usa exactamente los mismos scripts.
      - run: pnpm run typecheck

      - run: pnpm run lint
        if: ${{ !cancelled() }}

      - run: pnpm run test
        if: ${{ !cancelled() }}

      - run: pnpm run depcruise
        if: ${{ !cancelled() }}

      # Pregunta distinta a la del paso anterior: `depcruise` responde "¿hay aristas
      # prohibidas?"; esto responde "¿el análisis mira lo que debe?". Sin él, un
      # `exclude` demasiado amplio deja CI verde sin proteger nada.
      - run: pnpm run depcruise:cobertura
        if: ${{ !cancelled() }}
