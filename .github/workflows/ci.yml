name: CI

# Todas las ramas: la prueba negativa de la frontera (fase-0-ejecucion.md §6)
# no debe necesitar un PR para producir un run rojo.
on:
  push:
  workflow_dispatch:

# Repo público: nada de escritura por defecto.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # Antes de setup-node: si no, la caché de pnpm no encuentra el gestor.
      # Sin `version:` a propósito — lo lee del campo `packageManager` del
      # package.json, y darle ambos aborta con "multiple versions specified".
      - uses: pnpm/action-setup@v6.0.5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Los cuatro pasos van separados en vez de un único `pnpm verify`: un CI
      # rojo debe decir TODO lo que está mal de una vez. En local `pnpm verify`
      # sigue siendo la puerta única, y usa exactamente los mismos scripts.
      - run: pnpm run typecheck

      - run: pnpm run lint
        if: ${{ !cancelled() }}

      - run: pnpm run test
        if: ${{ !cancelled() }}

      - run: pnpm run depcruise
        if: ${{ !cancelled() }}
