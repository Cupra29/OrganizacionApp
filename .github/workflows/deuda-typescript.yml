name: Deuda TypeScript 7

# El disparador de ADR-016 depende de dos condiciones externas que nadie va a recordar
# dentro de seis meses. Esto lo comprueba solo.
#
# Un fallo de este workflow NO es una avería: es una tarea. Significa que ya se puede
# migrar y toca escribir el ADR que reemplace al 016. Va en un workflow aparte para que
# el estado de CI no se contamine.
on:
  schedule:
    - cron: '0 9 1 * *' # día 1 de cada mes, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Sin `pnpm install`: el script solo usa `fetch`, que es global en Node 24.
      - run: node scripts/comprobar-deuda-typescript.mjs
